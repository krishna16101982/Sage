<div class="stack max-w-lg">
  <app-page-header title="Edit module" backLink="/permissions/modules" />
  @if (error()) { <app-alert kind="error">{{ error() }}</app-alert> }
  @if (!module() && !error()) { <p class="text-sm text-muted">Loading...</p> }
  @if (module(); as m) { <app-permission-modules-form [module]="m" (saved)="saved($event)" /> }
</div>

<input class="field field-inline w-64" aria-label="Search permissions" placeholder="Search code, name or module"
       [(ngModel)]="search" (ngModelChange)="changed(true)" />
<select class="field field-inline" aria-label="Filter by module" [(ngModel)]="moduleId" (ngModelChange)="changed(false)">
  <option value="">All modules</option>
  @for (m of modules(); track m.id) { <option [ngValue]="m.id">{{ m.name }}</option> }
</select>
<select class="field field-inline" aria-label="Filter by status" [(ngModel)]="status" (ngModelChange)="changed(false)">
  <option value="">Any status</option>
  <option value="true">Active</option>
  <option value="false">Inactive</option>
</select>

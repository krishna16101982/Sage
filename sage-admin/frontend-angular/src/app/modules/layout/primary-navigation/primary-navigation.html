<nav aria-label="Main" class="sidebar">
  <div class="sidebar-title">Sage Admin</div>
  @for (section of sections(); track $index) {
    <div class="sidebar-section">
      @if (section.category) { <div class="sidebar-heading">{{ section.category }}</div> }
      <ul class="stack-xs">
        @for (item of section.items; track item.code) {
          <li>
            <a class="sidebar-link" [routerLink]="item.path" routerLinkActive #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">{{ item.name }}</a>
          </li>
        }
      </ul>
    </div>
  } @empty {
    <p class="hint">No screens are assigned to you yet. Ask an administrator for access.</p>
  }
</nav>

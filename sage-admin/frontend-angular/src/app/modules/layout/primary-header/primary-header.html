<header class="app-header">
  <button type="button" class="icon-button" aria-label="Show or hide the menu" (click)="toggleNav.emit()">
    <app-icon name="menu" />
  </button>
  <span class="header-crumb">Home</span>
  @if (pageTitle() && pageTitle() !== 'Dashboard') {
    <app-icon name="chevron-right" class="header-crumb" />
    <span class="header-title">{{ pageTitle() }}</span>
  }

  <div class="header-spacer"></div>

  <div class="header-search" role="search">
    <app-icon name="search" />
    <input #search class="field" type="search" placeholder="Search pages" aria-label="Search pages"
           (input)="onSearch(search.value)" (keydown)="onSearchKey($event)" (blur)="query.set('')" />
    @if (results().length > 0) {
      <div class="search-results" role="listbox" aria-label="Matching pages">
        @for (r of results(); track r.code; let i = $index) {
          <button type="button" class="search-result" role="option" [class.is-active]="i === activeIndex()"
                  [attr.aria-selected]="i === activeIndex()" (mousedown)="$event.preventDefault()" (click)="go(r.path, search)">
            <app-icon [name]="icons[r.code] ?? 'circle'" />
            <span>{{ r.name }}</span>
            <span class="hint">{{ r.category }}</span>
          </button>
        }
      </div>
    }
  </div>

  <button type="button" class="icon-button" [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="theme.mode() === 'dark' ? 'Light mode' : 'Dark mode'" (click)="theme.toggle()">
    <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" />
  </button>

  @if (auth.user(); as u) {
    <div class="header-user">
      <span class="avatar avatar-sm" aria-hidden="true">{{ initials() }}</span>
      <span class="header-user-name">{{ u.firstName }} {{ u.lastName }}</span>
    </div>
  }
  <button type="button" class="icon-button" aria-label="Sign out" title="Sign out" (click)="logout()">
    <app-icon name="log-out" />
  </button>
</header>

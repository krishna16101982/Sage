<div class="stack max-w-lg">
  <app-page-header [title]="user() ? 'Reset password: ' + user()!.firstName + ' ' + user()!.lastName : 'Reset password'" backLink="/users/list" />
  @if (error()) { <app-alert kind="error">{{ error() }}</app-alert> }
  @if (user()) {
    <app-reset-password-form [reset]="reset" cancelLink="/users/list" (done)="done()" />
  }
</div>

<div class="stack max-w-lg">
  <app-page-header title="Edit product" backLink="/products/list" />
  @if (error()) { <app-alert kind="error">{{ error() }}</app-alert> }
  @if (!product() && !error()) { <p class="text-sm text-muted">Loading...</p> }
  @if (product(); as p) { <app-products-form [product]="p" [categories]="categories()" (saved)="saved($event)" /> }
</div>

<nav aria-label="Main" class="sidebar">
  <a class="sidebar-brand" routerLink="/home" title="Sage Sales">
    <span class="brand-mark">S</span>
    <span class="brand-name">Sage <span class="brand-sub">Sales</span></span>
  </a>

  <div class="sidebar-nav">
    @for (section of sections(); track section.name) {
      <div class="sidebar-section">
        <div class="sidebar-heading">{{ section.name }}</div>
        <ul class="stack-xs">
          @for (item of section.items; track item.href) {
            <li>
              <a class="sidebar-link" [routerLink]="item.href" routerLinkActive #rla="routerLinkActive"
                 [attr.aria-current]="rla.isActive ? 'page' : null" [title]="item.label">
                <app-icon [name]="item.icon" />
                <span class="sidebar-label">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </div>

  @if (auth.user(); as u) {
    <div class="sidebar-user">
      <span class="avatar">{{ initials() }}</span>
      <div class="sidebar-user-text">
        <span class="sidebar-user-name">{{ u.firstName }} {{ u.lastName }}</span>
        <span class="sidebar-user-role">{{ u.isManager ? 'Sales manager' : 'Sales person' }}</span>
      </div>
    </div>
  }
</nav>
